{% extends "layout.html" %}

{% block content %}

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <div class="display-4 mb-3">🚀</div>

                        <h1 class="fw-bold">Mission Control</h1>

                        <p class="text-secondary">
                            Identify your space agency to continue.
                        </p>
                    </div>

                    <form 
                        id="agencyForm"
                        action="{{ url_for('shop') }}"
                    >

                        <div class="mb-4">
                            <label for="agencyName" class="form-label fw-semibold">
                                Space Agency Name
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg rounded-3"
                                id="agencyName"
                                name="agency_name"
                                placeholder="Enter agency name"
                                autocomplete="organization"
                                required
                            >

                            <div
                                id="agencyError"
                                class="alert alert-danger mt-3 d-none"
                                role="alert"
                            ></div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100 rounded-3"
                        >
                            Enter Mission Control
                            <span class="ms-2">→</span>
                        </button>

                    </form>

                </div>

                <div class="card-footer bg-light border-0 text-center py-3 rounded-bottom-4">
                    <small class="text-secondary">
                        Your agency identity will be saved in this browser.
                    </small>
                </div>

            </div>

        </div>
    </div>
</div>

<script src="/static/agency_name.js"></script>
{% endblock %}
